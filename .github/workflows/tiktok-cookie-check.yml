name: tiktok-cookie-check-disabled
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why cookie verification is disabled
        run: |
          echo "::error::TikTok session-cookie import and verification from GitHub Actions are disabled. Do not export or replay browser cookies."
          echo "See TIKTOK_SETUP.md for current supported options."
          exit 1
