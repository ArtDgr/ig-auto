name: tiktok-post-slots
# CLOUD-ONLY posting — no laptop. 3x daily AEST (Brisbane, UTC+10, no DST):
# 07:00 AEST = 21:00 UTC (prev day) | 12:00 AEST = 02:00 UTC | 18:00 AEST = 08:00 UTC
on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Brisbane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install deps + browser
        run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Restore TikTok session from secret (free, no laptop)
        run: |
          if [ -n "$TIKTOK_COOKIES_B64" ]; then
            printf '%s' "$TIKTOK_COOKIES_B64" | base64 -d > /tmp/tiktok-cookies.json
          elif [ -n "$TIKTOK_RAW_COOKIES" ]; then
            printf '%s' "$TIKTOK_RAW_COOKIES" > /tmp/tiktok-cookies.json
          else
            echo "::error::Set TIKTOK_COOKIES_B64 (base64-encoded JSON) or TIKTOK_RAW_COOKIES (Cookie-Editor JSON) in Actions secrets."
            exit 1
          fi
          node src/import-cookies.js /tmp/tiktok-cookies.json --profile=tiktok
        env:
          TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
          TIKTOK_RAW_COOKIES: ${{ secrets.TIKTOK_RAW_COOKIES }}
      - name: TikTok QA gate
        run: node src/tiktok-qa-check.js
      - name: TikTok headless post (1 slot)
        run: node src/tiktok-bot.js --force
      - name: Commit .done markers
        if: always()
        run: |
          git config user.name "tiktok slots bot"
          git config user.email "tiktok-slots@users.noreply.github.com"
          git add out/tiktok-ready 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tiktok slot $(date +%F\ %T\ %Z)"
          git pull --rebase --autostash || true
          git push || true
