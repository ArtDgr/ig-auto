name: ig_stealth

# Conservative Instagram publishing pipeline.
# Content is generated in GitHub Actions and handed to Buffer for publishing.
# No Instagram session cookies or browser credentials are used here.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without scheduling anything in Buffer"
        required: true
        default: true
        type: boolean
      include_reel:
        description: "Also schedule the daily Instagram Reel"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 19 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ig-auto
  cancel-in-progress: false

env:
  TZ: Australia/Sydney

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build daily Instagram content
        run: npm run daily

      - name: Validate generated Instagram manifest
        run: |
          test -f out/instagram-ready/manifest.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('out/instagram-ready/manifest.json','utf8')); if(!p.date || !Array.isArray(p.posts) || !p.posts.length) process.exit(1); console.log('QA manifest:', p.date, p.posts.length, 'post(s)')"

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/instagram-ready/ out/instagram-reels/
          git diff --cached --quiet || git commit -m "chore: generate daily Instagram content"
          git push

      - name: Buffer dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          test -n "$BUFFER_API_KEY" || { echo "BUFFER_API_KEY is not configured"; exit 1; }
          node src/buffer-publish.js schedule --dry --reel

      - name: Schedule posts in Buffer
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          test -n "$BUFFER_API_KEY" || { echo "BUFFER_API_KEY is not configured"; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_reel }}" != "true" ]; then
            node src/buffer-publish.js schedule
          else
            node src/buffer-publish.js schedule --reel
          fi
