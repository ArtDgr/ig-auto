name: tiktok-qr-bootstrap
# CLOUD-ONLY login — no laptop. Run from github.com (phone browser OK):
# Actions -> tiktok-qr-bootstrap -> Run workflow -> wait ~1 min ->
# download the `tiktok-qr` artifact (QR png) -> scan with the TikTok phone
# app -> job confirms SESSION CONFIRMED and uploads cookies artifact.
# Then: Settings -> Secrets -> Actions -> TIKTOK_COOKIES_B64 = contents of tiktok-cookies.b64.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install deps + browser + xvfb
        run: |
          npm ci
          npx playwright install --with-deps firefox
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Open QR login and wait for phone scan (10 min)
        run: xvfb-run -a node src/tiktok-qr-bootstrap.js
      - name: Upload QR + cookies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-qr
          path: |
            out/tiktok-qr.png
            out/tiktok-login-debug.png
            out/tiktok-cookies.json
            out/tiktok-cookies.b64
          retention-days: 1
