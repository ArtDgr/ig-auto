name: tiktok-post-disabled
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why TikTok posting is disabled
        run: |
          echo "::error::TikTok login is not verified through a supported user-authorization flow, and per-upload creator consent is unavailable in this workflow. No post was attempted."
          echo "::notice::TikTok's Content Sharing Guidelines prohibit an internal utility for posting to accounts managed by its developer and require creator preview, editable metadata, and express consent before each Direct Post upload."
          echo "See TIKTOK_SETUP.md for the supported API prerequisites and current publishing status."
          exit 1
