name: tiktok-bootstrap-disabled
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why cloud login bootstrap is disabled
        run: |
          echo "::error::TikTok session-cookie bootstrapping from GitHub Actions is disabled. Use TikTok's supported authorization flow; do not export or replay browser cookies."
          echo "See TIKTOK_SETUP.md for current supported options."
          exit 1
