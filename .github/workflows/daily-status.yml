name: daily-status
on:
  schedule:
    - cron: "0 22 * * *" # 08:00 AEST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node src/daily-status.js
      - run: |
          git config user.name "ig-auto bot"
          git config user.email "ig-auto@users.noreply.github.com"
          git add out/morning-check.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily status $(date +%F)" && git push || true
