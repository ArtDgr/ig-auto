name: daily-ig-build

on:
  schedule:
    # Sun-Thu 19:30 UTC = 05:30 AEST Mon-Fri (Australia/Brisbane, UTC+10, no DST)
    - cron: "30 19 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Brisbane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps + browsers + voice
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet edge-tts

      - name: Curate topics (RSS + deepen article cache)
        run: node src/scheduler.js curate

      - name: Generate IG plan (AEST today)
        run: node src/ig-generator.js

      - name: Ensure lead facts (deep-fetch chosen articles)
        run: node src/ensure-facts.js

      - name: Regenerate plan with rich facts
        run: node src/ig-generator.js

      - name: Render cards (light theme)
        run: node src/ig-render.js

      - name: QA gate (hard fail on defects)
        run: node src/qa-check.js

      - name: Render daily reel (voice + video)
        run: |
          node src/scheduler.js reel
          node -e "const fs=require('fs'),p=require('path');const d=new Date(new Date().getTime()+10*3600*1000).toISOString().slice(0,10).replace(/-/g,'');const dir='out/instagram-reels';const v=fs.readdirSync(dir).filter(f=>f.startsWith(d+'-')&&f.endsWith('.mp4'))[0];if(!v)throw new Error('no reel rendered for '+d);const c=fs.existsSync(p.join(dir,v.replace(/\.mp4$/,'.txt')))?fs.readFileSync(p.join(dir,v.replace(/\.mp4$/,'.txt')),'utf8').trim():'';if(!c)throw new Error('reel caption missing');if(fs.statSync(p.join(dir,v)).size<1000)throw new Error('reel file empty');console.log('reel OK: '+v)"

      - name: Prune old media (keep last 14 days)
        run: node src/prune-old.js

      - name: Commit artifacts + state
        run: |
          git config user.name "ig-auto bot"
          git config user.email "ig-auto@users.noreply.github.com"
          git add out/instagram-ready out/instagram-reels data
          git diff --cached --quiet || git commit -m "content $(date +%F) build"
          git push

      - name: Schedule cards + reel on Buffer
        run: node src/buffer-publish.js schedule --reel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Commit schedule state
        run: |
          git config user.name "ig-auto bot"
          git config user.email "ig-auto@users.noreply.github.com"
          git add data 2>/dev/null || true
          git status --porcelain
          git diff --cached --quiet || git commit -m "buffer schedule state $(date +%F)"
          git push

  # If anything in the daily build fails, email the boss the run link so it
  # never silently goes out without posting. Skipped when SMTP secrets are not
  # configured yet, so a missing secret can't add noise.
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: build-and-schedule
    if: failure()
    steps:
      - name: Timestamp
        id: ts
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Email failure alert
        if: ${{ secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "⚠️ IG auto-build FAILED — nothing posted today"
          to: ${{ vars.ALERT_EMAIL || 'artdodger79@gmail.com' }}
          from: The IT Support Guru Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            The daily Instagram build failed at ${{ steps.ts.outputs.now }}.

            Repo: ${{ github.repository }}
            Run:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            What this means:
            • No posts were scheduled or published today.
            • The next scheduled run is the next weekday 05:30 AEST build — it will retry automatically.

            Open the run link to see which step failed and why.
